<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">독립 Contrastive 검증에서 기준 E5와 후보의 성능 비교</title>
  <desc id="desc">Round 62와 Round 63에서 Recall at 1 및 MRR을 비교하는 그룹 막대그래프</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="100" y="95" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">Contrastive 근거 검증 — 독립 비교 결과</text>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="22" fill="#536174">기준 E5와 다중-positive 후보. 높은 값이 좋음.</text>
  <g font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033"><text x="230" y="215">Recall@1</text><text x="915" y="215">MRR</text></g>
  <g stroke="#d8dee8" stroke-width="2"><line x1="180" y1="680" x2="740" y2="680"/><line x1="180" y1="565" x2="740" y2="565"/><line x1="180" y1="450" x2="740" y2="450"/><line x1="180" y1="335" x2="740" y2="335"/><line x1="180" y1="220" x2="740" y2="220"/><line x1="860" y1="680" x2="1420" y2="680"/><line x1="860" y1="565" x2="1420" y2="565"/><line x1="860" y1="450" x2="1420" y2="450"/><line x1="860" y1="335" x2="1420" y2="335"/><line x1="860" y1="220" x2="1420" y2="220"/></g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#536174" text-anchor="end"><text x="165" y="686">0.0</text><text x="165" y="571">0.25</text><text x="165" y="456">0.50</text><text x="165" y="341">0.75</text><text x="165" y="226">1.0</text><text x="845" y="686">0.0</text><text x="845" y="571">0.25</text><text x="845" y="456">0.50</text><text x="845" y="341">0.75</text><text x="845" y="226">1.0</text></g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><rect x="285" y="244.2" width="80" height="435.8" fill="#2374ab"/><rect x="385" y="268.4" width="80" height="411.6" fill="#8a5a9e"/><text x="325" y="730" font-size="24" fill="#172033">R62</text><rect x="545" y="450" width="80" height="230" fill="#2374ab"/><rect x="645" y="450" width="80" height="230" fill="#8a5a9e"/><text x="625" y="730" font-size="24" fill="#172033">R63</text><rect x="965" y="232.1" width="80" height="447.9" fill="#2374ab"/><rect x="1065" y="244.2" width="80" height="435.8" fill="#8a5a9e"/><text x="1025" y="730" font-size="24" fill="#172033">R62</text><rect x="1225" y="361.8" width="80" height="318.2" fill="#2374ab"/><rect x="1325" y="346.5" width="80" height="333.5" fill="#8a5a9e"/><text x="1305" y="730" font-size="24" fill="#172033">R63</text></g>
  <g font-family="Arial, sans-serif" font-size="21" fill="#172033"><rect x="535" y="790" width="24" height="24" fill="#2374ab"/><text x="572" y="810">기준 E5</text><rect x="740" y="790" width="24" height="24" fill="#8a5a9e"/><text x="777" y="810">다중-positive 후보</text></g>
  <text x="100" y="860" font-family="Arial, sans-serif" font-size="20" fill="#536174">R62: 기존 고정 Test · R63: 새 독립 사람 검토. 후보는 R63에서 MRR만 소폭 상승해 승격하지 않음.</text>
  <text x="80" y="850" font-family="Arial, sans-serif" font-size="20" fill="#536174">Round 71 최종 독립 검증: Recall@1 · Recall@3 · MRR 모두 100%</text>
</svg>
