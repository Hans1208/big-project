<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 출력 3단계 위험 판정 기준</title><desc id="desc">safe, review required, high risk의 판단 기준과 관계 및 조정 사실 예시</desc>
  <rect width="1400" height="720" fill="#0f172a"/>
  <text x="80" y="88" fill="#f8fafc" font-family="Arial, sans-serif" font-size="40" font-weight="700">3단계 위험 판정 기준</text><text x="80" y="132" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="21">관계·대리 권한·조정 효력은 “언급”이 아니라 “문서 근거가 있는 확정 사실”인지 확인</text>
  <rect x="80" y="210" width="380" height="340" rx="20" fill="#14532d"/><text x="120" y="275" fill="#dcfce7" font-family="Arial, sans-serif" font-size="30" font-weight="700">safe</text><text x="120" y="330" fill="#dcfce7" font-family="Arial, sans-serif" font-size="20">전사·RAG의 명시 사실만 요약</text><text x="120" y="370" fill="#dcfce7" font-family="Arial, sans-serif" font-size="20">미정 사실은 미정으로 유지</text><text x="120" y="440" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="19">예: 조정조서 수령 사실이</text><text x="120" y="470" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="19">전사에 명시된 경우</text>
  <rect x="510" y="210" width="380" height="340" rx="20" fill="#854d0e"/><text x="550" y="275" fill="#fef3c7" font-family="Arial, sans-serif" font-size="30" font-weight="700">review_required</text><text x="550" y="330" fill="#fef3c7" font-family="Arial, sans-serif" font-size="20">가능성·확인 필요로 제한한</text><text x="550" y="370" fill="#fef3c7" font-family="Arial, sans-serif" font-size="20">무근거 관계·효력 주장</text><text x="550" y="440" fill="#fde68a" font-family="Arial, sans-serif" font-size="19">예: “대리권이 있을 수 있어</text><text x="550" y="470" fill="#fde68a" font-family="Arial, sans-serif" font-size="19">위임장 확인 필요”</text>
  <rect x="940" y="210" width="380" height="340" rx="20" fill="#7f1d1d"/><text x="980" y="275" fill="#fee2e2" font-family="Arial, sans-serif" font-size="30" font-weight="700">high_risk</text><text x="980" y="330" fill="#fee2e2" font-family="Arial, sans-serif" font-size="20">무근거 확정 사실·날짜·금액</text><text x="980" y="370" fill="#fee2e2" font-family="Arial, sans-serif" font-size="20">또는 Schema 오류</text><text x="980" y="440" fill="#fecaca" font-family="Arial, sans-serif" font-size="19">예: “조정조서가 확정됐다”</text><text x="980" y="470" fill="#fecaca" font-family="Arial, sans-serif" font-size="19">근거가 전사에 없는 경우</text>
  <text x="80" y="650" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">운영 목적: 자동 법률 판단이 아니라 위험 출력의 사람 검토 우선순위 제공</text>
  <text x="80" y="850" font-family="Arial, sans-serif" font-size="20" fill="#536174">Round 71 최종 기준: safe / review_required / high_risk</text>
</svg>
